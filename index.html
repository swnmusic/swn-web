<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Official website of SWN">
  <title>SWN</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    main {
      width: 100vw;
      height: 100svh;
      display: grid;
      place-items: center;
      background: #000;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="swn-landing.jpeg" alt="SWN — official website">
  </main>
</body>
</html>
