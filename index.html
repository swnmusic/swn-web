<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Official website of SWN">

  <title>SWN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #000;
    }

    main {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #000;
    }

    picture {
      display: block;
      width: 100%;
      height: 100svh;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>
  <main>
    <picture>
      <source
        media="(max-width: 768px)"
        srcset="swn-landing-mobile.png"
      >
      <img
        src="swn-landing.jpeg"
        alt="SWN — official website"
      >
    </picture>
  </main>
</body>
</html>
